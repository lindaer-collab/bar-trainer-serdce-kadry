<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бар-тренажёр · Сердце</title>
<style>
  :root {
    --bg: #14110f;
    --card: #221d1a;
    --card2: #2c2622;
    --text: #f1e9df;
    --muted: #9a8f84;
    --gold: #d9a441;
    --green: #5fb36b;
    --red: #d8625a;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; color: var(--gold); letter-spacing: .5px; }
  .tabs, .modes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  button {
    font: inherit; cursor: pointer; border: 1px solid #3a322c;
    background: var(--card); color: var(--text);
    padding: 10px 16px; border-radius: 999px; transition: .15s;
  }
  button:hover { border-color: var(--gold); }
  button.active { background: var(--gold); color: #1b1408; border-color: var(--gold); font-weight: 600; }
  button.primary { background: var(--gold); color: #1b1408; font-weight: 600; border-color: var(--gold); }
  button.good { background: var(--green); color: #07200c; border-color: var(--green); font-weight: 600; }
  button.bad { background: var(--red); color: #2a0806; border-color: var(--red); font-weight: 600; }
  button.ghost { background: transparent; }
  .stats { color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
  .progress { height: 6px; background: var(--card); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .progress > div { height: 100%; background: var(--green); width: 0; transition: .3s; }

  /* Flashcard */
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 28px 22px; min-height: 280px;
    display: flex; flex-direction: column; justify-content: center;
    border: 1px solid #332b25; cursor: pointer; position: relative;
  }
  .badge {
    position: absolute; top: 14px; left: 18px; font-size: 12px;
    color: var(--gold); text-transform: uppercase; letter-spacing: 1px;
  }
  .card h2 { margin: 0; font-size: 30px; text-align: center; }
  .hint { text-align: center; color: var(--muted); margin-top: 14px; font-size: 14px; }
  .sect { margin: 14px 0 6px; color: var(--gold); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .card p { margin: 0; line-height: 1.6; color: #ddd3c7; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 4px; line-height: 1.6; }
  .meta b { color: #cfc4b7; font-weight: 600; }
  .note {
    margin-top: 12px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--gold); background: rgba(217,164,65,.08);
    font-size: 14px; line-height: 1.5; color: #f0dfb5;
  }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions button { flex: 1; padding: 14px; border-radius: 12px; }

  /* ====== INGREDIENT ROWS ====== */
  .ing-list { display: flex; flex-direction: column; gap: 8px; }
  .ing-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ing-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .qty {
    flex-shrink: 0; font-size: 13px; font-weight: 600; color: #f1e9df;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }

  /* Pill (strong alcohol: filled) */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 15px;
    border: 2px solid transparent;
  }
  /* Syrup (outlined only) */
  .pill.outline { background: transparent !important; }

  /* Heart */
  .heart-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .heart-icon { width: 30px; height: 28px; flex-shrink: 0; position: relative; display:inline-flex; align-items:center; justify-content:center; }
  .heart-icon svg { width: 100%; height: 100%; }
  .heart-icon .emo { position: absolute; font-size: 12px; top: 5px; }

  /* Circle (water-based drinks) */
  .circ-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .circ {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,.25); position: relative;
  }
  .circ.dot::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 8px; height: 8px; background: #fff; border-radius: 50%;
    transform: translate(-50%,-50%);
  }
  .circ.steam::after {
    content: "♨"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-52%);
    font-size: 12px; color: #fff;
  }

  /* Triangle (additives) */
  .tri-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .tri-icon { width: 30px; height: 28px; flex-shrink: 0; position: relative; display:inline-flex; align-items:center; justify-content:center; }
  .tri-icon svg { width: 100%; height: 100%; }
  .tri-icon .emo { position: absolute; font-size: 12px; top: 10px; }

  /* Ice / glass etc */
  .serve { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card2); border: 1px solid #3a322c;
    padding: 6px 12px; border-radius: 999px; font-size: 14px; color: #ddd3c7;
  }
  .chip.heart-chip { border-color: #8a3a3a; }

  /* Layers */
  .layers-wrap { display: flex; align-items: flex-end; gap: 14px; margin-top: 6px; }
  .shot-glass {
    width: 60px; height: 110px; border: 2px solid #8b7e72; border-top: 2px dashed #8b7e72;
    border-radius: 4px 4px 14px 14px; display: flex; flex-direction: column-reverse;
    overflow: hidden; background: rgba(255,255,255,.03);
  }
  .layer-legend { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .layer-legend .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; border:1px solid rgba(255,255,255,.3); }

  /* Legend */
  .legend-box {
    background: var(--card2); border: 1px solid #3a322c; border-radius: 12px;
    padding: 12px 14px; margin-top: 12px; font-size: 14px; line-height: 1.8;
  }
  .legend-row { display: flex; align-items: center; gap: 10px; }

  /* Quiz */
  .quiz { background: var(--card); border-radius: var(--radius); padding: 22px; border: 1px solid #332b25; }
  .quiz h2 { margin: 0 0 12px; text-align: center; font-size: 28px; }
  textarea, input[type=text], select {
    width: 100%; background: var(--card2); color: var(--text);
    border: 1px solid #3a322c; border-radius: 12px; padding: 12px;
    font: inherit; margin-top: 6px;
  }
  textarea { min-height: 110px; resize: vertical; }
  label { font-size: 13px; color: var(--muted); display: block; margin-top: 12px; }
  .result { margin-top: 14px; padding: 14px; border-radius: 12px; background: var(--card2); line-height: 1.6; }
  .ok { color: var(--green); } .miss { color: var(--red); } .extra { color: var(--gold); }

  /* List/edit */
  .list-item {
    background: var(--card); border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    border: 1px solid #332b25;
  }
  .list-item small { color: var(--muted); display: block; }
  .list-item .btns { display: flex; gap: 6px; }
  .list-item button { padding: 6px 12px; font-size: 14px; }
  .hidden { display: none; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .footer { text-align: center; margin: 24px 0; }

  /* Editor ingredient rows */
  .ed-ing { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .ed-ing select { flex: 2; margin-top: 0; }
  .ed-ing input { flex: 1; margin-top: 0; }
  .ed-ing button { padding: 8px 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍸 Бар-тренажёр · Сердце</h1>

  <div class="tabs" id="cats"></div>
  <div class="modes" id="modes">
    <button data-mode="cards" class="active">Карточки</button>
    <button data-mode="quiz">Тест</button>
    <button data-mode="list">Рецепты</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="progress"><div id="bar"></div></div>

  <!-- Cards -->
  <div id="view-cards">
    <div class="card" id="card" onclick="flip()"></div>
    <div class="actions" id="cardActions" style="display:none">
      <button class="bad" onclick="mark(false)">Не знаю</button>
      <button class="good" onclick="mark(true)">Знаю</button>
    </div>
    <div style="text-align:center;margin-top:12px">
      <button class="ghost" onclick="toggleLegend()">ℹ️ Легенда</button>
    </div>
    <div id="legend" class="legend-box hidden"></div>
    <div class="footer"><button class="ghost" onclick="resetProgress()">Сбросить прогресс</button></div>
  </div>

  <!-- Quiz -->
  <div id="view-quiz" class="hidden">
    <div class="quiz">
      <div class="badge" id="qBadge" style="position:static;margin-bottom:8px"></div>
      <h2 id="qName"></h2>
      <label>Ингредиенты (по одному в строке, с объёмом, например: «Водка 20 мл»)</label>
      <textarea id="qAnswer" placeholder="Водка 20 мл&#10;Гренадин&#10;..."></textarea>
      <div class="row" style="margin-top:12px">
        <button class="primary" onclick="checkQuiz()">Проверить</button>
        <button onclick="nextQuiz()">Другой</button>
      </div>
      <div class="result hidden" id="qResult"></div>
    </div>
  </div>

  <!-- List / editor -->
  <div id="view-list" class="hidden">
    <button class="primary" onclick="openEditor()" style="margin-bottom:12px">＋ Добавить рецепт</button>
    <div id="editor" class="quiz hidden" style="margin-bottom:14px">
      <input type="hidden" id="eId">
      <label>Название</label><input type="text" id="eName">
      <label>Категория</label>
      <select id="eCat">
        <option value="long">Лонг</option>
        <option value="short">Шорт</option>
        <option value="shot">Шот</option>
        <option value="hot">Горячий</option>
      </select>
      <label>Ингредиенты</label>
      <div id="eIngBox"></div>
      <button class="ghost" style="margin-top:8px" onclick="addIngRow()">＋ Ингредиент</button>
      <div class="row">
        <div><label>Бокал</label><input type="text" id="eGlass"></div>
        <div><label>Сердце (замена бокала)</label><input type="text" id="eHeart"></div>
      </div>
      <div class="row">
        <div><label>Метод</label><input type="text" id="eMethod" placeholder="билд / шейк / слои"></div>
        <div><label>Лёд</label><input type="text" id="eIce"></div>
      </div>
      <label>Украшение</label><input type="text" id="eGarnish">
      <label>Как делать (описание)</label><textarea id="eDesc"></textarea>
      <label>Важно (подсказка / мнемоника)</label><textarea id="eNote" style="min-height:70px"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="primary" onclick="saveRecipe()">Сохранить</button>
        <button onclick="closeEditor()">Отмена</button>
      </div>
    </div>
    <div id="listBox"></div>
    <div class="footer">
      <button class="ghost" onclick="exportData()">Экспорт</button>
      <button class="ghost" onclick="document.getElementById('imp').click()">Импорт</button>
      <input type="file" id="imp" accept=".json" class="hidden" onchange="importData(event)">
      <button class="ghost" onclick="resetRecipes()">Вернуть исходное меню</button>
    </div>
  </div>
</div>

<script>

const STORAGE_KEY = "bar_recipes_v3";
const PROGRESS_KEY = "bar_progress_v3";

let recipes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || JSON.parse(JSON.stringify(DEFAULT_RECIPES));
let progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}");
let cat = "all", mode = "cards", current = null, flipped = false, quizCurrent = null;

const $ = id => document.getElementById(id);
const save = () => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pool = () => recipes.filter(r => cat === "all" || r.cat === cat);

/* ====================== РЕНДЕР ИНГРЕДИЕНТОВ ====================== */
function heartSVG(color) {
  return `<svg viewBox="0 0 24 22"><path d="M12 21s-9-5.8-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.200-9 12-9 12z" fill="${color}" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/></svg>`;
}
function triSVG(color) {
  return `<svg viewBox="0 0 24 22"><path d="M12 2 L22 20 L2 20 Z" fill="${color}" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
}

function renderIng(item) {
  const c = CATALOG[item.key] || CATALOG.other;
  const label = CATALOG[item.key] ? c.name : (item.label || "Другое");
  const qty = item.qty ? `<span class="qty">${esc(item.qty)}</span>` : "";
  let left = "";
  switch (c.type) {
    case "pill":
      left = `<span class="pill" style="background:${c.color};color:${c.text||'#111'};border-color:${c.color}">${esc(label)}</span>`;
      break;
    case "outline":
      left = `<span class="pill outline" style="border-color:${c.color};color:${c.color}">${esc(label)}</span>`;
      break;
    case "heart":
      left = `<span class="heart-wrap"><span class="heart-icon">${heartSVG(c.color)}${c.emoji?`<span class="emo">${c.emoji}</span>`:""}</span>${esc(label)}</span>`;
      break;
    case "circle":
      left = `<span class="circ-wrap"><span class="circ ${c.mod||''}" style="background:${c.color}"></span>${esc(label)}</span>`;
      break;
    case "tri":
    default:
      left = `<span class="tri-wrap"><span class="tri-icon">${triSVG(c.color)}${c.emoji?`<span class="emo">${c.emoji}</span>`:""}</span>${esc(label)}</span>`;
  }
  return `<div class="ing-row"><div class="ing-left">${left}</div>${qty}</div>`;
}
function renderIngList(r) {
  return `<div class="ing-list">${r.ing.map(renderIng).join("")}</div>`;
}

/* ====================== СХЕМА СЛОЁВ ====================== */
function layerColor(key) {
  const c = CATALOG[key] || CATALOG.other;
  return c.color;
}
function renderLayers(r) {
  if (!r.layers || !r.layers.length) return "";
  // слои снизу вверх: tripleSec(>1/2), amaretto, cream_liq... Высоты условные
  const n = r.layers.length;
  const heights = r.layers.map((k, i) => {
    if (k === "grenDrop") return 6;
    if (i === 0 && n > 1) return 45;
    return Math.max(15, Math.floor(55 / (n - 1 || 1)));
  });
  const total = heights.reduce((a,b)=>a+b,0);
  const blocks = r.layers.map((k, i) =>
    `<div style="height:${heights[i]/total*100}%;background:${layerColor(k)}"></div>`).join("");
  const legend = r.layers.map((k, i) => {
    const c = CATALOG[k] || CATALOG.other;
    return `${i+1}. <span class="dot" style="background:${c.color}"></span>${esc(c.name)}`;
  }).join("<br>");
  return `<div class="sect">Слои (снизу вверх)</div>
    <div class="layers-wrap">
      <div class="shot-glass">${blocks}</div>
      <div class="layer-legend">${legend}</div>
    </div>`;
}

/* ====================== ЛЕГЕНДА ====================== */
function renderLegend() {
  const sample = (key) => renderIng({ key, qty: "" }).replace('<div class="ing-row">','<div class="legend-row">');
  return `
  <b>Как читать карточку:</b>
  <div style="margin-top:8px">
    <div class="legend-row">${sample("vodka")} — крепкий алкоголь (заливка)</div>

    <div class="legend-row">${sample("cola")} — вода, газировки, соки (кружок)</div>
    <div class="legend-row">${sample("grenadine")} — сиропы (контур)</div>
    <div class="legend-row">${sample("tabasco")} — добавки: соусы, специи, цитрусы (треугольник)</div>
  </div>
  <div style="margin-top:10px;color:var(--muted)">Справа от названия — количество. <b>●●●</b> — сплеши, <b>💧</b> — капля, <b>≈</b> — примерно, <b>&gt; ½</b> — больше половины шота.</div>`;
}
function toggleLegend() {
  const l = $("legend");
  l.innerHTML = renderLegend();
  l.classList.toggle("hidden");
}

/* ====================== ТАБЫ / СТАТИСТИКА ====================== */
function renderTabs() {
  $("cats").innerHTML = Object.entries(CATS).map(([k, v]) =>
    `<button data-cat="${k}" class="${k===cat?'active':''}">${v}</button>`).join("");
  document.querySelectorAll("#cats button").forEach(b => b.onclick = () => { cat = b.dataset.cat; current = null; renderAll(); });
  document.querySelectorAll("#modes button").forEach(b => {
    b.classList.toggle("active", b.dataset.mode === mode);
    b.onclick = () => { mode = b.dataset.mode; renderAll(); };
  });
}
function score(r) {
  const p = progress[r.id] || { known: 0, unknown: 0 };
  return p.known - p.unknown * 2;
}
function isLearned(r) { return score(r) >= 2; }
function renderStats() {
  const p = pool();
  const learned = p.filter(isLearned).length;
  $("stats").textContent = `Выучено: ${learned} из ${p.length}`;
  $("bar").style.width = p.length ? (learned / p.length * 100) + "%" : "0";
}
function pickRandom(excludeId) {
  let p = pool();
  if (p.length > 1) p = p.filter(r => r.id !== excludeId);
  if (!p.length) return null;
  const weights = p.map(r => Math.max(1, 5 - score(r)));
  const total = weights.reduce((a, b) => a + b, 0);
  let x = Math.random() * total;
  for (let i = 0; i < p.length; i++) { x -= weights[i]; if (x <= 0) return p[i]; }
  return p[0];
}

/* ====================== КАРТОЧКИ ====================== */
function renderCard() {
  if (!current || !pool().includes(current)) current = pickRandom();
  const c = $("card");
  if (!current) { c.innerHTML = "<p style='text-align:center'>Нет рецептов в этой категории</p>"; $("cardActions").style.display = "none"; return; }
  if (!flipped) {
    c.innerHTML = `<div class="badge">${CATS[current.cat]} · ${VOLUME[current.cat] || ""}</div>
      <h2>${esc(current.name)}</h2>
      <div class="hint">Вспомни состав, затем нажми на карточку</div>`;
    $("cardActions").style.display = "none";
  } else {
    const r = current;
    const chips = [];
    if (r.glass) chips.push(`<span class="chip">🥃 ${esc(r.glass)}</span>`);
    if (r.heart) chips.push(`<span class="chip heart-chip">❤️ ${esc(r.heart)}</span>`);
    if (r.method) chips.push(`<span class="chip">🔧 ${esc(r.method)}</span>`);
    if (r.ice) chips.push(`<span class="chip">🧊 ${esc(r.ice)}</span>`);
    if (r.garnish) chips.push(`<span class="chip">🍋 ${esc(r.garnish)}</span>`);
    c.innerHTML = `<div class="badge">${CATS[r.cat]} · ${VOLUME[r.cat] || ""}</div>
      <h2 style="font-size:24px;margin:14px 0 6px">${esc(r.name)}</h2>
      <div class="sect">Состав</div>
      ${renderIngList(r)}
      ${renderLayers(r)}
      <div class="sect">Подача</div>
      <div class="serve">${chips.join("") || '<span class="meta">—</span>'}</div>
      <div class="sect">Приготовление</div>
      <p>${esc(r.desc||"—")}</p>
      ${r.note ? `<div class="note">💡 ${esc(r.note)}</div>` : ""}`;
    $("cardActions").style.display = "flex";
  }
}
function flip() { if (!current) return; flipped = !flipped; renderCard(); }
function mark(known) {
  const p = progress[current.id] || { known: 0, unknown: 0 };
  known ? p.known++ : p.unknown++;
  progress[current.id] = p; save();
  flipped = false; current = pickRandom(current.id);
  renderCard(); renderStats();
}
function resetProgress() {
  if (confirm("Сбросить весь прогресс?")) { progress = {}; save(); renderAll(); }
}

/* ====================== ТЕСТ ====================== */
function nextQuiz() {
  quizCurrent = pickRandom(quizCurrent && quizCurrent.id);
  $("qAnswer").value = ""; $("qResult").classList.add("hidden");
  if (!quizCurrent) { $("qName").textContent = "Нет рецептов"; $("qBadge").textContent = ""; return; }
  $("qBadge").textContent = CATS[quizCurrent.cat] + " · " + (VOLUME[quizCurrent.cat] || "");
  $("qName").textContent = quizCurrent.name;
}
function norm(s) {
  return s.toLowerCase().replace(/ё/g, "е")
    .replace(/\([^)]*\)/g, " ")
    .replace(/[\d\/\.,\-–~≈×●💧½]+\s*(мл|ml|шт|г|гр|листов|капли|капель|сплеша|сплеш)?/g, " ")
    .replace(/доверху|сверху|долить|по вкусу|на глаз|по стенке|при наличии|капля|сплеши/g, " ")
    .replace(/[^a-zа-я\s]/g, " ").replace(/\s+/g, " ").trim();
}
function ingText(it) {
  const c = CATALOG[it.key] || CATALOG.other;
  return c.name + (it.qty ? " " + it.qty : "");
}
function checkQuiz() {
  if (!quizCurrent) return;
  const user = $("qAnswer").value.split("\n").map(s => s.trim()).filter(Boolean);
  const real = quizCurrent.ing.map(ingText);
  const userN = user.map(norm), realN = real.map(norm);
  const matched = new Set();
  const found = [], missed = [];
  realN.forEach((rn, i) => {
    const idx = userN.findIndex((u, j) => !matched.has(j) && u && rn && (u.includes(rn) || rn.includes(u)));
    if (idx >= 0) { matched.add(idx); found.push(real[i]); } else missed.push(real[i]);
  });
  const extra = user.filter((_, j) => !matched.has(j));
  let html = "";
  if (!missed.length && !extra.length) html += "<b class='ok'>✔ Отлично! Все компоненты верны.</b><br>";
  if (found.length) html += `<div class="ok">Верно: ${found.map(esc).join(", ")}</div>`;
  if (missed.length) html += `<div class="miss">Пропущено: ${missed.map(esc).join(", ")}</div>`;
  if (extra.length) html += `<div class="extra">Лишнее: ${extra.map(esc).join(", ")}</div>`;
  html += `<hr style="border:0;border-top:1px solid #3a322c;margin:10px 0">
    <b>Правильный рецепт:</b>
    <div style="margin-top:8px">${renderIngList(quizCurrent)}</div>
    <br><span style="color:var(--muted)">${esc(quizCurrent.glass||"")}${quizCurrent.heart ? " (сердце: " + esc(quizCurrent.heart) + ")" : ""} · ${esc(quizCurrent.method||"")} · ${esc(quizCurrent.ice||"")}</span>
    <br>${esc(quizCurrent.desc||"")}
    ${quizCurrent.note ? `<div class="note">💡 ${esc(quizCurrent.note)}</div>` : ""}`;
  const p = progress[quizCurrent.id] || { known: 0, unknown: 0 };
  (!missed.length && !extra.length) ? p.known++ : p.unknown++;
  progress[quizCurrent.id] = p; save(); renderStats();
  $("qResult").innerHTML = html; $("qResult").classList.remove("hidden");
}

/* ====================== СПИСОК + РЕДАКТОР ====================== */
function renderList() {
  const items = pool();
  $("listBox").innerHTML = items.length ? items.map(r => `
    <div class="list-item">
      <div><b>${esc(r.name)}</b><small>${CATS[r.cat]} · ${r.ing.length} комп. ${isLearned(r)?'· ✔ выучен':''}</small></div>
      <div class="btns">
        <button onclick="openEditor(${r.id})">✎</button>
        <button onclick="delRecipe(${r.id})">✕</button>
      </div>
    </div>`).join("") : "<p style='color:var(--muted)'>Пусто</p>";
}

const GROUPS = [
  ["Крепкий алкоголь", "pill"], ["Ликёры и вермуты", "heart"], ["Вода, газировки, соки", "circle"],
  ["Сиропы", "outline"], ["Добавки", "tri"]
];
function optionsHTML(selected) {
  return GROUPS.map(([title, type]) =>
    `<optgroup label="${title}">` +
    Object.entries(CATALOG).filter(([k, v]) => v.type === type && k !== "other")
      .map(([k, v]) => `<option value="${k}" ${k===selected?'selected':''}>${v.name}</option>`).join("") +
    `</optgroup>`).join("") + `<option value="other" ${selected==="other"?'selected':''}>Другое…</option>`;
}
function addIngRow(key, qty, label) {
  const row = document.createElement("div");
  row.className = "ed-ing";
  row.innerHTML = `<select>${optionsHTML(key || "vodka")}</select>
    <input type="text" placeholder="кол-во (40 мл, ½, ●●●...)" value="${esc(qty||'')}">
    <button class="ghost" onclick="this.parentElement.remove()">✕</button>`;
  row.dataset.label = label || "";
  $("eIngBox").appendChild(row);
}
function openEditor(id) {
  const r = recipes.find(x => x.id === id) || { name:"", cat: cat==="all"?"long":cat, ing:[], glass:"", heart:"", method:"", ice:"", garnish:"", desc:"", note:"" };
  $("eId").value = id || "";
  $("eName").value = r.name; $("eCat").value = r.cat;
  $("eIngBox").innerHTML = "";
  (r.ing.length ? r.ing : [I("vodka","")]).forEach(it => addIngRow(it.key, it.qty, it.label));
  $("eGlass").value = r.glass || ""; $("eHeart").value = r.heart || "";
  $("eMethod").value = r.method || ""; $("eIce").value = r.ice || "";
  $("eGarnish").value = r.garnish || ""; $("eDesc").value = r.desc || ""; $("eNote").value = r.note || "";
  $("editor").classList.remove("hidden"); $("editor").scrollIntoView({behavior:"smooth"});
}
function closeEditor() { $("editor").classList.add("hidden"); }
function saveRecipe() {
  const name = $("eName").value.trim();
  const ing = [...document.querySelectorAll("#eIngBox .ed-ing")].map(row => {
    const key = row.querySelector("select").value;
    const qty = row.querySelector("input").value.trim();
    const item = { key, qty };
    if (key === "other") {
      const label = prompt("Название ингредиента «Другое»:", row.dataset.label || "") || "Другое";
      item.label = label;
    }
    return item;
  });
  if (!name || !ing.length) { alert("Нужны название и хотя бы один ингредиент"); return; }
  const data = { name, cat: $("eCat").value, ing,
    glass: $("eGlass").value.trim(), heart: $("eHeart").value.trim(),
    method: $("eMethod").value.trim(), ice: $("eIce").value.trim(),
    garnish: $("eGarnish").value.trim(), desc: $("eDesc").value.trim(), note: $("eNote").value.trim() };
  const id = +$("eId").value;
  if (id) {
    const old = recipes.find(r => r.id === id);
    Object.assign(old, data);
  } else recipes.push({ id: Date.now(), ...data });
  save(); closeEditor(); renderAll();
}
function delRecipe(id) {
  if (!confirm("Удалить рецепт?")) return;
  recipes = recipes.filter(r => r.id !== id); delete progress[id];
  if (current && current.id === id) current = null;
  save(); renderAll();
}
function resetRecipes() {
  if (confirm("Вернуть исходное меню? Твои правки и новые рецепты пропадут.")) {
    recipes = JSON.parse(JSON.stringify(DEFAULT_RECIPES)); progress = {}; save(); renderAll();
  }
}
function exportData() {
  const blob = new Blob([JSON.stringify(recipes, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "recipes.json"; a.click();
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { const d = JSON.parse(rd.result); if (!Array.isArray(d)) throw 0;
      recipes = d; save(); renderAll();
    } catch { alert("Не удалось прочитать файл"); }
  };
  rd.readAsText(f);
}

function renderAll() {
  renderTabs(); renderStats();
  ["cards","quiz","list"].forEach(m => $("view-"+m).classList.toggle("hidden", m !== mode));
  if (mode === "cards") { flipped = false; renderCard(); }
  if (mode === "quiz") nextQuiz();
  if (mode === "list") renderList();
}
renderAll();
</script>
