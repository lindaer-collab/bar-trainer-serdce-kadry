<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бар-тренажёр · Сердце</title>
<style>
  :root {
    --bg: #14110f;
    --card: #221d1a;
    --card2: #2c2622;
    --text: #f1e9df;
    --muted: #9a8f84;
    --gold: #d9a441;
    --green: #5fb36b;
    --red: #d8625a;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; color: var(--gold); letter-spacing: .5px; }
  .tabs, .modes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  button {
    font: inherit; cursor: pointer; border: 1px solid #3a322c;
    background: var(--card); color: var(--text);
    padding: 10px 16px; border-radius: 999px; transition: .15s;
  }
  button:hover { border-color: var(--gold); }
  button.active { background: var(--gold); color: #1b1408; border-color: var(--gold); font-weight: 600; }
  button.primary { background: var(--gold); color: #1b1408; font-weight: 600; border-color: var(--gold); }
  button.good { background: var(--green); color: #07200c; border-color: var(--green); font-weight: 600; }
  button.bad { background: var(--red); color: #2a0806; border-color: var(--red); font-weight: 600; }
  button.ghost { background: transparent; }
  .stats { color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
  .progress { height: 6px; background: var(--card); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .progress > div { height: 100%; background: var(--green); width: 0; transition: .3s; }

  /* Flashcard */
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 28px 22px; min-height: 280px;
    display: flex; flex-direction: column; justify-content: center;
    border: 1px solid #332b25; cursor: pointer; position: relative;
  }
  .badge {
    position: absolute; top: 14px; left: 18px; font-size: 12px;
    color: var(--gold); text-transform: uppercase; letter-spacing: 1px;
  }
  .card h2 { margin: 0; font-size: 30px; text-align: center; }
  .hint { text-align: center; color: var(--muted); margin-top: 14px; font-size: 14px; }
  .sect { margin: 14px 0 6px; color: var(--gold); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .card p { margin: 0; line-height: 1.6; color: #ddd3c7; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 4px; line-height: 1.6; }
  .meta b { color: #cfc4b7; font-weight: 600; }
  .note {
    margin-top: 12px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--gold); background: rgba(217,164,65,.08);
    font-size: 14px; line-height: 1.5; color: #f0dfb5;
  }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions button { flex: 1; padding: 14px; border-radius: 12px; }

  /* ====== STUDY (accordion) ====== */
  .study-list { display: flex; flex-direction: column; gap: 10px; }
  .study-item {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid #332b25; overflow: hidden;
  }
  .study-header {
    width: 100%; background: transparent; border: 0; border-radius: 0;
    padding: 16px 18px; text-align: left; color: var(--text);
    font: inherit; font-size: 17px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
  }
  .study-header:hover { background: rgba(255,255,255,.03); border-color: transparent; }
  .study-arrow { color: var(--gold); font-size: 16px; }
  .study-body { padding: 0 18px 18px; }
  .study-body h2 { text-align: left; font-size: 20px; margin: 6px 0 6px; }
  .study-body p { color: #ddd3c7; line-height: 1.6; }
  .study-body .serve { margin-top: 4px; }

  /* ====== INGREDIENT ROWS ====== */
  .ing-list { display: flex; flex-direction: column; gap: 8px; }
  .ing-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ing-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .qty {
    flex-shrink: 0; font-size: 13px; font-weight: 600; color: #f1e9df;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 15px;
    border: 2px solid transparent;
  }
  .pill.outline { background: transparent !important; }

  .heart-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .heart-icon { width: 30px; height: 28px; flex-shrink: 0; position: relative; display:inline-flex; align-items:center; justify-content:center; }
  .heart-icon svg { width: 100%; height: 100%; }
  .heart-icon .emo { position: absolute; font-size: 12px; top: 5px; }

  .circ-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .circ {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,.25); position: relative;
  }
  .circ.dot::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 8px; height: 8px; background: #fff; border-radius: 50%;
    transform: translate(-50%,-50%);
  }
  .circ.steam::after {
    content: "♨"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-52%);
    font-size: 12px; color: #fff;
  }

  .tri-wrap { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .tri-icon { width: 30px; height: 28px; flex-shrink: 0; position: relative; display:inline-flex; align-items:center; justify-content:center; }
  .tri-icon svg { width: 100%; height: 100%; }
  .tri-icon .emo { position: absolute; font-size: 12px; top: 10px; }

  .serve { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card2); border: 1px solid #3a322c;
    padding: 6px 12px; border-radius: 999px; font-size: 14px; color: #ddd3c7;
  }
  .chip.kadry { border-color: #5b7a8a; }
  .chip.serdtse { border-color: #8a3a3a; }

  /* Layers */
  .layers-wrap { display: flex; align-items: flex-end; gap: 14px; margin-top: 6px; }
  .shot-glass {
    width: 60px; height: 110px; border: 2px solid #8b7e72; border-top: 2px dashed #8b7e72;
    border-radius: 4px 4px 14px 14px; display: flex; flex-direction: column-reverse;
    overflow: hidden; background: rgba(255,255,255,.03);
  }
  .layer-legend { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .layer-legend .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; border:1px solid rgba(255,255,255,.3); }

  /* Legend */
  .legend-box {
    background: var(--card2); border: 1px solid #3a322c; border-radius: 12px;
    padding: 12px 14px; margin-top: 12px; font-size: 14px; line-height: 1.8;
  }
  .legend-row { display: flex; align-items: center; gap: 10px; }

  /* Editor / quiz container */
  .quiz { background: var(--card); border-radius: var(--radius); padding: 22px; border: 1px solid #332b25; }
  textarea, input[type=text], input[type=number], select {
    width: 100%; background: var(--card2); color: var(--text);
    border: 1px solid #3a322c; border-radius: 12px; padding: 12px;
    font: inherit; margin-top: 6px;
  }
  textarea { min-height: 110px; resize: vertical; }
  label { font-size: 13px; color: var(--muted); display: block; margin-top: 12px; }
  .result { margin-top: 14px; padding: 14px; border-radius: 12px; background: var(--card2); line-height: 1.6; }
  .ok { color: var(--green); } .miss { color: var(--red); } .extra { color: var(--gold); }

  /* List/edit */
  .list-item {
    background: var(--card); border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    border: 1px solid #332b25;
  }
  .list-item small { color: var(--muted); display: block; }
  .list-item .btns { display: flex; gap: 6px; }
  .list-item button { padding: 6px 12px; font-size: 14px; }
  .hidden { display: none; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .footer { text-align: center; margin: 24px 0; }

  /* Editor ingredient rows */
  .ed-ing { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .ed-ing select { flex: 2; margin-top: 0; }
  .ed-ing input { flex: 1; margin-top: 0; }
  .ed-ing button { padding: 8px 12px; }

  /* Editor layer rows */
  .ed-layer { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .ed-layer input[type=color] {
    flex: 0 0 46px; height: 42px; padding: 2px; border-radius: 8px;
    background: var(--card2); border: 1px solid #3a322c; cursor: pointer; margin-top: 0;
  }
  .ed-layer input[type=number] { flex: 0 0 76px; margin-top: 0; }
  .ed-layer input[type=text] { flex: 1; margin-top: 0; }
  .ed-layer button { padding: 8px 12px; }

  /* Ingredient manager */
  .im-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
  .im-row .btns { display: flex; gap: 6px; }
  .im-row .btns button { padding: 6px 12px; font-size: 14px; }

  /* Congrats modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: var(--card); border-radius: var(--radius); padding: 28px 22px;
    max-width: 400px; width: 100%; text-align: center; border: 1px solid #3a322c;
  }
  .modal .emoji { font-size: 52px; line-height: 1; }
  .modal h2 { margin: 12px 0 10px; color: var(--gold); font-size: 22px; }
  .modal p { margin: 0 0 22px; line-height: 1.5; }
  .modal .actions { display: flex; flex-direction: column; gap: 8px; margin: 0; }
  .modal .actions button { padding: 12px; border-radius: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍸 Бар-тренажёр · Сердце</h1>

  <div class="tabs" id="cats"></div>
  <div class="modes" id="modes">
    <button data-mode="study" class="active">Изучить рецепты</button>
    <button data-mode="cards" class="">Проверь себя</button>
    <button data-mode="list" class="">Рецепты</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="progress"><div id="bar" style="width: 0px;"></div></div>

  <!-- Study -->
  <div id="view-study" class="">
    <div class="study-list" id="studyList"></div>
  </div>

  <!-- Check yourself -->
  <div id="view-cards" class="hidden">
    <div class="card" id="card" onclick="flip()"></div>
    <div class="actions" id="cardActions" style="display:none">
      <button class="bad" onclick="mark(false)">Не знаю</button>
      <button class="good" onclick="mark(true)">Знаю</button>
    </div>
    <div style="text-align:center;margin-top:12px">
      <button class="ghost" onclick="toggleLegend()">ℹ️ Легенда</button>
    </div>
    <div id="legend" class="legend-box hidden"></div>
    <div class="footer"><button class="ghost" onclick="resetProgress()">Сбросить прогресс</button></div>
  </div>

  <!-- List / editor -->
  <div id="view-list" class="hidden">
    <div class="row" style="margin-bottom:12px">
      <button class="primary" onclick="openEditor()">＋ Добавить рецепт</button>
      <button onclick="toggleIngManager()">⚙ Ингредиенты</button>
      <button onclick="toggleGlassManager()">⚙ Посуда</button>
    </div>

    <div id="ingManager" class="quiz hidden" style="margin-bottom:14px">
      <div id="ingManagerList"></div>
      <div id="ingEditor" class="hidden" style="margin-top:12px;border-top:1px solid #3a322c;padding-top:12px">
        <div class="sect" id="ingEditorTitle">Редактировать ингредиент</div>
        <label>Название</label><input type="text" id="ieName" oninput="updateIngPreview()">
        <label>Тип</label>
        <select id="ieType" onchange="updateIngPreview()">
          <option value="pill">Алкогольная основа (плашка)</option>
          <option value="heart">Ликёр / вермут (сердечко)</option>
          <option value="circle">Вода / сок (кружок)</option>
          <option value="outline">Сироп (контур)</option>
          <option value="tri">Добавка (треугольник)</option>
        </select>
        <div class="row">
          <div><label>Цвет</label><input type="color" id="ieColor" value="#ff8800" oninput="updateIngPreview()"></div>
          <div><label>Emoji (не обяз.)</label><input type="text" id="ieEmoji" maxlength="4" oninput="updateIngPreview()"></div>
        </div>
        <label style="display:flex;align-items:center;gap:6px;margin-top:12px">
          <input type="checkbox" id="ieSteam" style="width:auto" onchange="updateIngPreview()"> Пар (для горячего напитка)
        </label>
        <div class="result" id="iePreview" style="margin-top:10px"><div class="ing-row"><div class="ing-left"><span class="pill" style="background:#d9cafe;color:#111;border-color:#d9cafe">Самбука</span></div></div></div>
        <div class="row" style="margin-top:12px">
          <button class="primary" onclick="saveIngredient()">Сохранить</button>
          <button onclick="closeIngEditor()">Отмена</button>
        </div>
      </div>
    </div>

    <div id="glassManager" class="quiz hidden" style="margin-bottom:14px">
      <div class="sect" style="margin-top:0">Кадры (стекло)</div>
      <div id="glassManagerKadry"></div>
      <div class="row" style="margin-top:8px;margin-bottom:16px">
        <input type="text" id="newGlassKadry" placeholder="Новый бокал (например, Хайбол)">
        <button class="ghost" onclick="addGlass('kadry')">＋ Добавить</button>
      </div>

      <div class="sect">Сердце (бумага / пластик)</div>
      <div id="glassManagerSerdtse"></div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="newGlassSerdtse" placeholder="Новый бокал (например, Красный 0.5)">
        <button class="ghost" onclick="addGlass('serdtse')">＋ Добавить</button>
      </div>
    </div>

    <div id="editor" class="quiz hidden" style="margin-bottom:14px">
      <input type="hidden" id="eId" value="25">
      <label>Название</label><input type="text" id="eName">
      <label>Категория</label>
      <select id="eCat">
        <option value="long">Лонг</option>
        <option value="short">Шорт</option>
        <option value="shot">Шот</option>
        <option value="hot">Горячий</option>
      </select>
      <label>Ингредиенты</label>
      <div id="eIngBox"></div>
      <button class="ghost" style="margin-top:8px" onclick="addIngRow()">＋ Ингредиент</button>

      <label style="margin-top:16px">Схема слоёв (для шотов, снизу вверх)</label>
      <div id="eLayerBox"></div>
      <button class="ghost" style="margin-top:8px" onclick="addLayerRow()">＋ Слой</button>

      <div class="row">
        <div>
          <label>Посуда «Кадры» (стекло)</label>
          <select id="eGlassKadry"><option value="">—</option><option value="Хайбол">Хайбол</option><option value="Рокс">Рокс</option><option value="Стеклянный шот">Стеклянный шот</option><option value="6 стеклянных шотов" selected="">6 стеклянных шотов</option><option value="Бокал для шампанского">Бокал для шампанского</option></select>
        </div>
        <div>
          <label>Посуда «Сердце» (бумага)</label>
          <select id="eGlassSerdtse"><option value="">—</option><option value="Красный 0.5">Красный 0.5</option><option value="Чёрный 0.2">Чёрный 0.2</option><option value="Прозрачный пластиковый">Прозрачный пластиковый</option><option value="Без посуды">Без посуды</option></select>
        </div>
      </div>
      <div class="row">
        <div><label>Метод</label><input type="text" id="eMethod" placeholder="билд / шейк / слои"></div>
        <div><label>Лёд</label><input type="text" id="eIce"></div>
      </div>
      <label>Украшение</label><input type="text" id="eGarnish">
      <label>Как делать (описание)</label><textarea id="eDesc"></textarea>
      <label>Важно (подсказка / мнемоника)</label><textarea id="eNote" style="min-height:70px"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="primary" onclick="saveRecipe()">Сохранить</button>
        <button onclick="closeEditor()">Отмена</button>
      </div>
    </div>

    <div id="listBox"></div>
    <div class="footer">
      <button class="ghost" onclick="downloadHTML()">💾 Скачать HTML</button>
      <button class="ghost" onclick="exportData()">Экспорт</button>
      <button class="ghost" onclick="document.getElementById('imp').click()">Импорт</button>
      <input type="file" id="imp" accept=".json" class="hidden" onchange="importData(event)">
      <button class="ghost" onclick="resetRecipes()">Вернуть исходное меню</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="congrats">
  <div class="modal">
    <div class="emoji">🎉</div>
    <h2>Поздравляю!</h2>
    <p>Ты освоил коктейли блока «<span id="congratsCat"></span>»</p>
    <div class="actions">
      <button class="primary" onclick="restartBlock()">Начать заново</button>
      <button onclick="nextBlock()">Перейти к следующему блоку</button>
      <button class="ghost" onclick="closeCongrats()">Закрыть</button>
    </div>
  </div>

const $ = id => document.getElementById(id);
function safeParse(s) { try { return s ? JSON.parse(s) : null; } catch { return null; } }
function getBaked(id) {
  const el = $(id);
  const txt = el ? el.textContent.trim() : "";
  if (!txt) return null;
  try { return JSON.parse(txt); } catch { return null; }
}

let CATALOG = (() => {
  const stored = safeParse(localStorage.getItem(CATALOG_KEY));
  if (stored) return stored;
  const baked = getBaked("baked-catalog");
  if (baked) return baked;
  return JSON.parse(JSON.stringify(DEFAULT_CATALOG));
})();

/* ====================== МИГРАЦИИ ====================== */
function convertLayersToScheme(layers) {
  const n = layers.length;
  const raw = layers.map((k, i) => {
    if (k === "grenDrop") return 6;
    if (i === 0 && n > 1) return 45;
    return Math.max(15, 55 / (n - 1 || 1));
  });
  const total = raw.reduce((a, b) => a + b, 0) || 1;
  return layers.map((k, i) => {
    const c = CATALOG[k] || DEFAULT_CATALOG.other;
    return {
      color: c.color || "#888",
      pct: Math.round(raw[i] / total * 100),
      label: c.name || k
    };
  });
}
function migrateRecipe(r) {
  const rr = { ...r };
  if (rr.glass !== undefined) { rr.glassKadry = rr.glass; delete rr.glass; }
  if (rr.heart !== undefined) { rr.glassSerdtse = rr.heart; delete rr.heart; }
  if (rr.cat === "shot" && Array.isArray(rr.ing)) {
    const pills = rr.ing.filter(it => CATALOG[it.key] && CATALOG[it.key].type === "pill");
    const rest = rr.ing.filter(it => !CATALOG[it.key] || CATALOG[it.key].type !== "pill");
    rr.ing = [...pills, ...rest];
  }
  if (!rr.layerScheme && Array.isArray(rr.layers) && rr.layers.length) {
    rr.layerScheme = convertLayersToScheme(rr.layers);
    delete rr.layers;
  }
  return rr;
}
recipes = recipes.map(migrateRecipe);

/* ====================== ХЕЛПЕРЫ ====================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pool = () => recipes.filter(r => cat === "all" || r.cat === cat);

/* ====================== ПРОГРЕСС ====================== */
function getProgress(id) { return progress[id] || { streak: 0, correct: 0, wrong: 0 }; }
function isLearned(r) { return getProgress(r.id).streak >= STREAK_TO_LEARN; }

function pickRandom(excludeId) {
  let p = pool().filter(r => !isLearned(r));
  if (p.length > 1 && excludeId !== undefined) {
    const filtered = p.filter(r => r.id !== excludeId);
    if (filtered.length) p = filtered;
  }
  if (!p.length) return null;
  return p[Math.floor(Math.random() * p.length)];
}

/* ====================== РЕНДЕР ИНГРЕДИЕНТОВ ====================== */
function heartSVG(color) {
  return `<svg viewBox="0 0 24 22"><path d="M12 21s-9-5.8-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.2-9 12-9 12z" fill="${color}" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/></svg>`;
}
function triSVG(color) {
  return `<svg viewBox="0 0 24 22"><path d="M12 2 L22 20 L2 20 Z" fill="${color}" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
}

function renderIng(item) {
  const c = CATALOG[item.key] || CATALOG.other;
  let label = c.name;
  if (item.label && (item.key === "other" || !CATALOG[item.key])) label = item.label;
  const qty = item.qty ? `<span class="qty">${esc(item.qty)}</span>` : "";
  let left = "";
  switch (c.type) {
    case "pill":
      left = `<span class="pill" style="background:${c.color};color:${c.text||'#111'};border-color:${c.color}">${esc(label)}</span>`;
      break;
    case "outline":
      left = `<span class="pill outline" style="border-color:${c.color};color:${c.color}">${esc(label)}</span>`;
      break;
    case "heart":
      left = `<span class="heart-wrap"><span class="heart-icon">${heartSVG(c.color)}${c.emoji?`<span class="emo">${c.emoji}</span>`:""}</span>${esc(label)}</span>`;
      break;
    case "circle":
      left = `<span class="circ-wrap"><span class="circ ${c.mod||''}" style="background:${c.color}"></span>${esc(label)}</span>`;
      break;
    case "tri":
    default:
      left = `<span class="tri-wrap"><span class="tri-icon">${triSVG(c.color)}${c.emoji?`<span class="emo">${c.emoji}</span>`:""}</span>${esc(label)}</span>`;
  }
  return `<div class="ing-row"><div class="ing-left">${left}</div>${qty}</div>`;
}
function renderIngList(r) {
  return `<div class="ing-list">${r.ing.map(renderIng).join("")}</div>`;
}

/* ====================== СХЕМА СЛОЁВ ====================== */
function renderLayerScheme(r) {
  if (!r.layerScheme || !r.layerScheme.length) return "";
  const total = r.layerScheme.reduce((a, s) => a + (Number(s.pct) || 0), 0) || 1;
  
  // Рисуем стакан (в коде он заполняется снизу вверх благодаря flex-direction: column-reverse)
  const blocks = r.layerScheme.map(s => {
    const h = (Number(s.pct) || 0) / total * 100;
    const border = (Number(s.pct) || 0) < 5 ? "border-top:1px solid rgba(255,255,255,.2);" : "";
    return `<div style="height:${h}%;background:${s.color};${border}"></div>`;
  }).join("");
  
  // Легенду разворачиваем, чтобы она читалась сверху вниз (как и сам стакан)
  const legend = [...r.layerScheme].reverse().map((s, i) => {
    const num = r.layerScheme.length - i;
    return `${num}. <span class="dot" style="background:${s.color}"></span>${esc(s.label)} — ${s.pct}%`;
  }).join("<br>");
  
  return `<div class="sect">Схема слоёв (сверху вниз)</div>
    <div class="layers-wrap">
      <div class="shot-glass">${blocks}</div>
      <div class="layer-legend">${legend}</div>
    </div>`;
}

function renderCard() {
  const c = $("card");
  if (!current) current = pickRandom();
  if (!current) {
    c.innerHTML = `<div class="badge">Готово</div>
      <h2 style="text-align:center;font-size:40px;margin:8px 0">🎉</h2>

  if (!flipped) {

    $("cardActions").style.display = "flex";
  }
}
function flip() { if (!current) return; flipped = !flipped; renderCard(); }

function mark(known) {
  if (!current) return;
  const p = getProgress(current.id);
  if (known) { p.streak = (p.streak || 0) + 1; p.correct = (p.correct || 0) + 1; }
  else { p.streak = 0; p.wrong = (p.wrong || 0) + 1; }
  progress[current.id] = p;
  save();
  flipped = false;

  if (cat !== "all" && pool().every(isLearned)) {
    renderStats();
    showCongrats(cat);
    return;
  }
  current = pickRandom(current.id);
  renderCard(); renderStats();
}

  if (confirm("Сбросить весь прогресс?")) { progress = {}; save(); renderAll(); }
}

function openEditor(id) {
  const r = recipes.find(x => x.id === id) || {
    name:"", cat: cat==="all"?"long":cat, ing:[],
    glassKadry:"", glassSerdtse:"", method:"", ice:"", garnish:"", desc:"", note:"", layerScheme:[]
  };
  $("eId").value = id || "";
  $("eName").value = r.name; $("eCat").value = r.cat;
  $("eIngBox").innerHTML = "";
  (r.ing.length ? r.ing : [I("vodka","")]).forEach(it => addIngRow(it.key, it.qty, it.label));
  $("eLayerBox").innerHTML = "";
  let scheme = r.layerScheme;
  if (!scheme && r.layers) scheme = convertLayersToScheme(r.layers);
  if (scheme) scheme.forEach(s => addLayerRow(s));
  
  populateGlassSelect("eGlassKadry", "kadry", r.glassKadry);
  populateGlassSelect("eGlassSerdtse", "serdtse", r.glassSerdtse);
  
  $("eMethod").value = r.method || ""; $("eIce").value = r.ice || "";
  $("eGarnish").value = r.garnish || ""; $("eDesc").value = r.desc || ""; $("eNote").value = r.note || "";
  $("editor").classList.remove("hidden"); $("editor").scrollIntoView({behavior:"smooth"});
}
function closeEditor() { $("editor").classList.add("hidden"); }

function saveRecipe() {
  const name = $("eName").value.trim();
  let ing = [...document.querySelectorAll("#eIngBox .ed-ing")].map(row => {
    const key = row.querySelector("select").value;
    const qty = row.querySelector("input").value.trim();
    const item = { key, qty };
    if (key === "other") {
      const label = prompt("Название ингредиента «Другое»:", row.dataset.label || "") || "Другое";
      item.label = label;
    }
    return item;
  });
  if (!name || !ing.length) { alert("Нужны название и хотя бы один ингредиент"); return; }
  const catVal = $("eCat").value;
  if (catVal === "shot") {
    const pills = ing.filter(it => CATALOG[it.key] && CATALOG[it.key].type === "pill");
    const rest = ing.filter(it => !CATALOG[it.key] || CATALOG[it.key].type !== "pill");
    ing = [...pills, ...rest];
  }
  const layerScheme = [...document.querySelectorAll("#eLayerBox .ed-layer")].map(row => ({
    color: row.querySelector("input[type=color]").value,
    pct: Number(row.querySelector("input[type=number]").value) || 0,
    label: row.querySelector("input[type=text]").value.trim()
  })).filter(s => s.label || s.pct > 0);
  
  const data = {
    name, cat: catVal, ing,
    glassKadry: $("eGlassKadry").value.trim(), 
    glassSerdtse: $("eGlassSerdtse").value.trim(),
    method: $("eMethod").value.trim(), ice: $("eIce").value.trim(),
    garnish: $("eGarnish").value.trim(), desc: $("eDesc").value.trim(), note: $("eNote").value.trim(),
    layerScheme
  };
  const id = +$("eId").value;
  if (id) {
    const old = recipes.find(r => r.id === id);
    Object.assign(old, data);
    delete old.layers;
  } else {
    recipes.push({ id: Date.now(), ...data });
  }
  saveRecipes();
  closeEditor();
  renderAll();
}
function delRecipe(id) {
  if (!confirm("Удалить рецепт?")) return;
  recipes = recipes.filter(r => r.id !== id);
  delete progress[id];
  if (current && current.id === id) current = null;
  saveRecipes(); saveProgress(); renderAll();
}
function resetRecipes() {
  if (!confirm("Вернуть исходное меню? Твои правки и новые рецепты пропадут.")) return;
  const baked = getBaked("baked-recipes");
  recipes = JSON.parse(JSON.stringify(baked || DEFAULT_RECIPES)).map(migrateRecipe);

}

    emoji: $("ieEmoji").value.trim(),

function saveIngredient() {
  const name = $("ieName").value.trim();
  if (!name) { alert("Введите название"); return; }
  const data = {
    name,
    type: $("ieType").value,
    color: $("ieColor").value,
    emoji: $("ieEmoji").value.trim(),
    mod: $("ieSteam").checked ? "steam" : ""
  };
  if (editingIngKey) {
    CATALOG[editingIngKey] = { ...CATALOG[editingIngKey], ...data };
  } else {
    const key = "ing_" + Date.now().toString(36);
    CATALOG[key] = data;
  }
  saveCatalog();
  closeIngEditor();
  renderIngManager();
  renderAll();
}
function deleteIngredient(key) {
  if (key === "other") return;
  const c = CATALOG[key];
  if (!c) return;
  const used = recipes.filter(r => r.ing.some(it => it.key === key)).length;
  let msg = "Удалить ингредиент?";
  if (used) msg = `Используется в ${used} рецептах. Удалить и заменить на «Другое»?`;
  if (!confirm(msg)) return;
  if (used) {
    recipes.forEach(r => {
      r.ing.forEach(it => {
        if (it.key === key) { it.key = "other"; it.label = c.name; }
      });
    });
    saveRecipes();
  }
  delete CATALOG[key];
  saveCatalog();
  renderIngManager();
  renderAll();
}

/* ====================== МЕНЕДЖЕР ПОСУДЫ ====================== */
function toggleGlassManager() {
  const m = $("glassManager");
  m.classList.toggle("hidden");
  if (!m.classList.contains("hidden")) { $("ingManager").classList.add("hidden"); renderGlassManager(); }
}

function renderGlassManager() {
  let htmlK = "";
  GLASSES.kadry.forEach((g, i) => {
    htmlK += `<div class="im-row"><div>${esc(g)}</div><div class="btns"><button onclick="delGlass('kadry', ${i})">✕</button></div></div>`;
  });
  if (!htmlK) htmlK = "<p style='color:var(--muted)'>Пусто</p>";
  $("glassManagerKadry").innerHTML = htmlK;

  let htmlS = "";
  GLASSES.serdtse.forEach((g, i) => {
    htmlS += `<div class="im-row"><div>${esc(g)}</div><div class="btns"><button onclick="delGlass('serdtse', ${i})">✕</button></div></div>`;
  });
  if (!htmlS) htmlS = "<p style='color:var(--muted)'>Пусто</p>";
  $("glassManagerSerdtse").innerHTML = htmlS;
}

function addGlass(type) {
  const inp = type === "kadry" ? $("newGlassKadry") : $("newGlassSerdtse");
  const val = inp.value.trim();
  if (!val) return;
  if (!GLASSES[type].includes(val)) {
    GLASSES[type].push(val);
    saveGlasses();
  }
  inp.value = "";
  renderGlassManager();
}

function delGlass(type, index) {
  const val = GLASSES[type][index];
  if (!confirm(`Удалить «${val}» из списка? Рецепты, где оно использовалось, останутся без изменений, но в выпадающем списке его больше не будет.`)) return;
  GLASSES[type].splice(index, 1);
  saveGlasses();
  renderGlassManager();
}

/* ====================== ИМПОРТ / ЭКСПОРТ ====================== */
function exportData() {
  const data = { recipes, catalog: CATALOG, glasses: GLASSES };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "bar-trainer-data.json"; a.click();
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (Array.isArray(d)) {
        recipes = d.map(migrateRecipe);
      } else if (d && Array.isArray(d.recipes)) {
        recipes = d.recipes.map(migrateRecipe);
        if (d.catalog && typeof d.catalog === "object") CATALOG = d.catalog;
        if (d.glasses && typeof d.glasses === "object") GLASSES = d.glasses;
      } else throw 0;
      save(); renderAll();
      alert("Импортировано");
    } catch { alert("Не удалось прочитать файл"); }
  };
  rd.readAsText(f);
  e.target.value = "";
}

/* ====================== СОХРАНЕНИЕ В HTML ====================== */
function downloadHTML() {
  const clone = document.documentElement.cloneNode(true);

  const bakedR = clone.querySelector("#baked-recipes");
  const bakedC = clone.querySelector("#baked-catalog");
  const bakedG = clone.querySelector("#baked-glasses");
  if (bakedR) bakedR.textContent = JSON.stringify(recipes).replace(/<\//g, "<\\/");
  if (bakedC) bakedC.textContent = JSON.stringify(CATALOG).replace(/<\//g, "<\\/");
  if (bakedG) bakedG.textContent = JSON.stringify(GLASSES).replace(/<\//g, "<\\/");

  ["cats","card","listBox","ingManagerList","glassManagerKadry","glassManagerSerdtse","legend","studyList","eIngBox","eLayerBox","stats"].forEach(id => {
    const el = clone.querySelector("#" + id); if (el) el.innerHTML = "";
  });
  const bar = clone.querySelector("#bar"); if (bar) bar.style.width = "0";
  const cardActions = clone.querySelector("#cardActions"); if (cardActions) cardActions.style.display = "none";

  ["editor","ingEditor","congrats","legend","ingManager","glassManager"].forEach(id => {
    const el = clone.querySelector("#" + id); if (el) el.classList.add("hidden");
  });

  clone.querySelector("#view-study").classList.remove("hidden");
  clone.querySelector("#view-cards").classList.add("hidden");
  clone.querySelector("#view-list").classList.add("hidden");
  clone.querySelectorAll("#modes button").forEach(b => {
    b.classList.toggle("active", b.dataset.mode === "study");
  });

  const html = "<!DOCTYPE html>\n" + clone.outerHTML;
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bar-trainer.html";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ====================== RENDER ALL ====================== */
function renderAll() {
  renderTabs(); renderStats();
  ["study","cards","list"].forEach(m => $("view-" + m).classList.toggle("hidden", m !== mode));
  if (mode === "study") renderStudy();
  if (mode === "cards") {
    if (!current || !pool().includes(current) || isLearned(current)) {
      current = pickRandom();
      flipped = false;
    }
    renderCard();
  }
  if (mode === "list") {
    renderList();
    if (!$("ingManager").classList.contains("hidden")) renderIngManager();
    if (!$("glassManager").classList.contains("hidden")) renderGlassManager();
  }
}
renderAll();
</script>
